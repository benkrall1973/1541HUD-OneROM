name: Validate public package

on:
  push:
    branches: [v8.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Package and HUD regression checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public package boundary
        shell: pwsh
        run: ./tools/maintenance/Test-Public-Package.ps1 -PackageRoot .

      - name: Check project documentation links
        shell: pwsh
        run: python tools/maintenance/Check-Documentation.py

      - name: Run 1541HUD regression tests
        shell: pwsh
        run: python -m unittest discover -s 1541hud/tests -v

  firmware-host-tests:
    name: Firmware protocol and cooperative wait checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monitor transport and RPM validity
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I firmware-monitor/active-plugins/system/1541HUD-Monitor-USB/include firmware-monitor/tests/test_monitor_protocol.c firmware-monitor/active-plugins/system/1541HUD-Monitor-USB/src/monitor_protocol.c -o /tmp/monitor-protocol
          /tmp/monitor-protocol
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I firmware-monitor/active-plugins/user/1541HUD-Monitor/src firmware-monitor/tests/test_monitor_rpm_validity.c -o /tmp/monitor-rpm
          /tmp/monitor-rpm
          gcc -O2 -std=c11 -fshort-enums -DORA_HOST_TEST -DHUD1541_DECODE_HOST_TEST -Wall -Wextra -Werror -Wno-unused-function -fsanitize=address,undefined -I source/one-rom-v0.8.1/firmware/ora firmware-monitor/tests/test_monitor_headers.c -o /tmp/monitor-headers
          /tmp/monitor-headers
          gcc -O1 -std=c11 -fshort-enums -DORA_HOST_TEST -DBUILD_VERSION=5 -Wall -Wextra -Werror -fsanitize=address,undefined -I firmware-monitor/tests/stubs -I firmware-monitor/active-plugins/system/1541HUD-Monitor-USB/include -I source/one-rom-v0.8.1/firmware/ora firmware-monitor/tests/test_monitor_led.c firmware-monitor/active-plugins/system/1541HUD-Monitor-USB/src/monitor_protocol.c -o /tmp/monitor-led
          /tmp/monitor-led
      - name: Control cooperative wait regression
        run: |
          gcc -O2 -DORA_HOST_TEST -fshort-enums -DMAJOR_VERSION=0 -DMINOR_VERSION=8 -DPATCH_VERSION=1 -DBUILD_VERSION=5 -DNV_ERASE_FN_MAX=80 -ffunction-sections -fdata-sections -I source/one-rom-v0.8.1/firmware/ora -I firmware-control/active-plugins/user/1541HUD-Host-Control-v0.8.1/src qualification/test-cooperative-knock.c -Wl,--gc-sections -o /tmp/control-knock
          /tmp/control-knock

  host-dependency-tests:
    name: Patched host CLI and ZIP regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Export supported source and verify host dependency pins
        run: |
          mkdir -p .buildtools/host-security-core
          git archive HEAD:source/one-rom-v0.8.1 | tar -x -C .buildtools/host-security-core
          bash tools/maintenance/Apply-Host-Dependencies.sh "$PWD/.buildtools/host-security-core"
      - name: Test CLI and archive loading
        run: bash tools/maintenance/Test-Host-Dependencies.sh "$PWD/.buildtools/host-security-core"
      - name: Install pinned advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit supported host dependency graph
        run: bash tools/maintenance/Audit-Host-Dependencies.sh "$PWD/.buildtools/host-security-core"

      - name: Verify supported source provenance
        run: python3 tools/maintenance/Verify-Source-Dependencies.py .buildtools/host-security-core

  windows-cli:
    name: Build and test patched Windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Build and test Windows CLI
        shell: pwsh
        run: ./tools/maintenance/Build-Windows-CLI.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cli-tested
          path: .buildtools/windows-cli-package/
          if-no-files-found: error

  firmware-arm:
    name: Full Fire-24G Control and Monitor ARM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install pinned Arm GNU toolchain
        run: |
          toolchain="$(bash source/one-rom-v0.8.1/ci/install-arm-toolchain.sh "$RUNNER_TEMP/arm-gnu" 15.3.rel1)"
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Build, compose and inspect both roles
        run: |
          set -o pipefail
          mkdir -p .buildtools/source-check
          bash tools/maintenance/Test-Source-Build.sh 2>&1 | tee .buildtools/source-check/full-build.log
      - name: Keep build evidence, not flashable test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-build-evidence
          path: |
            .buildtools/source-check/full-build.log
            .buildtools/source-check/build-verification.json
          if-no-files-found: warn
