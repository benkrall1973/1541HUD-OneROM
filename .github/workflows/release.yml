name: 1541HUD Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate 1541HUD release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical files and mailbox ABI
        shell: bash
        run: |
          set -euo pipefail

          test -f 1541hud/Build-1541HUD-V031.ps1
          test -f 1541hud/gui/1541HUD_V0.0.31_PIO_DMA.py
          test -f 1541hud/README.md
          test -f 1541hud/CHANGELOG.md
          test -f plugins/user/1541hud-probe/src/1541hud_probe_v031.c
          test -f plugins/user/1541hud-probe/src/1541hud_mailbox.h
          test -f plugins/system/usb/include/1541hud_mailbox.h

          cmp plugins/user/1541hud-probe/src/1541hud_mailbox.h \
              plugins/system/usb/include/1541hud_mailbox.h

          grep -q 'HUD1541_PASSIVE_UB4' firmware/src/piodma/pio.c
          grep -q 'HUD1541_PASSIVE_UB4' ci/build.sh
          python3 -m py_compile 1541hud/gui/1541HUD_V0.0.31_PIO_DMA.py

          if git ls-files | grep -Ei '(^|/)(build-1541hud|build-drivehud|__pycache__)(/|$)|(\.bin$|\.uf2$|\.elf$|\.o$|\.pyc$)|pre_drivehud'; then
            echo 'Tracked generated artifact or obsolete backup found.' >&2
            exit 1
          fi

  release:
    name: Create 1541HUD GitHub release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build 1541HUD release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"

          CHANGELOG_SECTION=$(awk -v version="$VERSION" '
            $0 == "## " version || index($0, "## " version " -") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' 1541hud/CHANGELOG.md)

          if [ -z "$CHANGELOG_SECTION" ]; then
            echo "No 1541HUD changelog entry found for $VERSION" >&2
            exit 1
          fi

          cat > release.md <<EOF
          # 1541HUD $VERSION

          Passive real-time Commodore 1541 monitoring for OneROM Fire-24-E.

          $CHANGELOG_SECTION

          ## Project notes

          - This is a 1541HUD release, not an upstream OneROM release.
          - OneROM v0.7.1 source and history are retained as the firmware/build foundation.
          - The monitor is intentionally passive and must not drive the Commodore 1541 bus.
          - Source releases are provided by the Git tag. Generated BIN/UF2 build products are not committed to the repository.

          ## Upstream attribution

          1541HUD is an independent derivative of OneROM by Piers Finlayson. See the repository README and LICENSE.md for attribution and licensing details.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "1541HUD ${GITHUB_REF#refs/tags/}" \
            --notes-file release.md \
            --latest
