name: Dependency refresh probe

on:
  push:
    branches:
      - security/dependency-updates
    paths:
      - ".github/workflows/dependency-refresh-probe.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/dependency-refresh-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-and-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: source/one-rom-v0.8.1/rust
    steps:
      - uses: actions/checkout@v4
      - name: Install current compatible Rust stable
        run: rustup toolchain install 1.93 --profile minimal && rustup default 1.93
      - name: Resolve patched Zip and Rustls lines in a disposable workspace
        run: |
          sed -i 's/^zip = "6\.0"$/zip = "9.0.5"/' fw/Cargo.toml
          sed -i 's/^zip = "8\.2"$/zip = "9.0.5"/' cli/Cargo.toml
          cargo update -p zip@6.0.0 --precise 9.0.5
          cargo update -p rustls@0.23.42 --precise 0.23.46
          cargo check -p onerom-fw -p onerom-cli
          git diff --check
      - name: Commit generated dependency resolution to security branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock fw/Cargo.toml cli/Cargo.toml
          git diff --cached --quiet && exit 0
          git commit -m "security: refresh Zip and Rustls dependency resolution"
          git push origin HEAD:security/dependency-updates
