name: 1541HUD Sanity

on:
  workflow_dispatch:
  push:
    paths:
      - '1541hud/**'
      - 'plugins/user/1541hud-probe/**'
      - 'plugins/system/usb/**'
      - 'firmware/src/piodma/pio.c'
      - 'ci/build.sh'
      - '.github/workflows/1541hud-sanity.yml'
  pull_request:
    paths:
      - '1541hud/**'
      - 'plugins/user/1541hud-probe/**'
      - 'plugins/system/usb/**'
      - 'firmware/src/piodma/pio.c'
      - 'ci/build.sh'
      - '.github/workflows/1541hud-sanity.yml'

permissions:
  contents: read

jobs:
  source-sanity:
    name: 1541HUD source sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical 1541HUD sources
        shell: bash
        run: |
          set -euo pipefail

          test -f 1541hud/Build-1541HUD-V031.ps1
          test -f 1541hud/gui/1541HUD_V0.0.31_PIO_DMA.py
          test -f 1541hud/README.md
          test -f plugins/user/1541hud-probe/src/1541hud_probe_v031.c
          test -f plugins/user/1541hud-probe/src/1541hud_mailbox.h
          test -f plugins/system/usb/include/1541hud_mailbox.h

          cmp plugins/user/1541hud-probe/src/1541hud_mailbox.h \
              plugins/system/usb/include/1541hud_mailbox.h

          grep -q 'HUD1541_PASSIVE_UB4' firmware/src/piodma/pio.c
          grep -q 'HUD1541_PASSIVE_UB4' ci/build.sh
          grep -q '1541HUD' 1541hud/README.md

          python3 -m py_compile 1541hud/gui/1541HUD_V0.0.31_PIO_DMA.py

          if git ls-files | grep -Ei '(^|/)(build-1541hud|build-drivehud|__pycache__)(/|$)|(\.bin$|\.uf2$|\.elf$|\.o$|\.pyc$)|pre_drivehud'; then
            echo 'Tracked generated artifact or obsolete backup found.' >&2
            exit 1
          fi

          echo '1541HUD source sanity checks passed.'
