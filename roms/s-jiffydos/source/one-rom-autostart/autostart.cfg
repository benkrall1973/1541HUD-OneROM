MEMORY {
    ROM:  start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
    RAM:  start = $0200, size = $0600, file = "";
}

SEGMENTS {
    BOOT:    load = ROM, type = ro, start = $E000;
    CODE:    load = ROM, run = RAM, type = ro, define = yes;
    VECTORS: load = ROM, type = ro, start = $FFFA;
}
